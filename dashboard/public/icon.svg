<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="HELT app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DE2E6"/>
      <stop offset="0.55" stop-color="#12B5C9"/>
      <stop offset="1" stop-color="#0A8FA6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <rect width="512" height="512" rx="118" fill="url(#sheen)"/>
  <!-- Voice bars -->
  <g fill="#ffffff">
    <rect x="150" y="188" width="34" height="136" rx="17"/>
    <rect x="328" y="188" width="34" height="136" rx="17"/>
  </g>
  <!-- Heartbeat pulse -->
  <path d="M150 256 H206 L232 256 L256 150 L280 356 L306 256 H362"
